<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#redGrad)" filter="url(#shadow)" />
    <!-- Stylized 'S' & 'J' Knowledge Crest -->
    <path d="M 24 24 C 24 20, 40 18, 54 26 C 44 32, 34 34, 40 44 C 46 54, 58 48, 56 60 C 54 70, 30 68, 24 60 C 30 58, 38 56, 36 50 C 34 44, 24 40, 24 24 Z" fill="#FFFFFF" />
    <!-- Graduation / Star Accent -->
    <polygon points="56,22 60,30 68,30 62,36 64,44 56,39 48,44 50,36 44,30 52,30" fill="#FDE047" />
  </g>

  <!-- Typography -->
  <text x="105" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="1.5" fill="#111827">
    SKILL<tspan fill="#DC2626">J</tspan>
  </text>
  
  <!-- Subtitle Tagline & Ownership -->
  <text x="108" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5" fill="#6B7280">
    BY <tspan fill="#DC2626">UNIVERSE</tspan> • LEARN • TEACH • GROW
  </text>
</svg>
